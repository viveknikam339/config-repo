server:
  port: 8085

spring:
  redis:
    host: localhost
    port: 6379
  application:
    name: smartim-user-service
  datasource:
    url: jdbc:mysql://localhost:3306/smartim_user_db
    username: root
    password: Pa$$w0rd
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: a-string-secret-at-least-256-bits-long
  expiration: 86400000 # 1 day in ms

sonar:
  projectKey: smartim-user-service
  projectName: Smartim User Service
  projectVersion: 1.0
  sources: src/main/java
  tests: src/test/java
  language: java
  java:
    binaries: target/classes
  sourceEncoding: UTF-8
  junit:
    reportPaths: target/surefire-reports
  host.url: http://localhost:9000
